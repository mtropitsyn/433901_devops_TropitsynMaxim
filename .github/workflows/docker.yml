name: Verify Kafka calculator
on:
  push:
    branches: [kafka]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CalculatorDocker.sln -c Release
      - run: dotnet run --project CalculatorWeb.Checks -c Release --no-build
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project CalculatorWeb --configuration Release --no-build
