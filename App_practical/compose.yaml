name: calculator-lab

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: calculator
      MARIADB_USER: calculator
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run scripts/Initialize-Database.ps1 first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run scripts/Initialize-Database.ps1 first}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-calculations.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${STUDENT_NUMBER:-16}-calculator:latest
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-5016}
    environment:
      Database__Server: db
      Database__Port: 3306
      Database__Name: calculator
      Database__User: calculator
      Database__Password: ${MARIADB_PASSWORD:?Run scripts/Initialize-Database.ps1 first}
    ports:
      - "${APP_PORT:-5016}:${APP_PORT:-5016}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb-data:
