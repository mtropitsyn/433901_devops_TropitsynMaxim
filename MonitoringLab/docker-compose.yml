name: tropitsyn16-monitoring

services:
  web:
    image: tropitsyn16-calculator:monitoring
    build: .
    network_mode: bridge
    environment:
      Monitoring__EnableDemoEndpoints: "true"
    ports:
      - "${APP_PORT:-5316}:5016"
    healthcheck:
      test: ["CMD", "dotnet", "CalculatorWeb.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
